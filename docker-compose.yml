# Steuerbot – Betrieb mit Docker Compose
#   App:   nur intern erreichbar, read-only, ohne Root-Rechte und Capabilities
#   Caddy: einziger offener Dienst (80/443), TLS nach BSI TR-02102-2
name: steuerbot

services:
  app:
    image: steuerbot:${STEUERBOT_IMAGE_TAG:-latest}
    build:
      context: .
      args:
        BUILD_IMAGE: ${BUILD_IMAGE:-node:22-alpine}
        VERSION: ${STEUERBOT_IMAGE_TAG:-latest}
    env_file: .env
    environment:
      STEUERBOT_TRUST_PROXY: "1"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=64m,uid=65532,gid=65532
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    restart: unless-stopped
    networks: [web]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      STEUERBOT_DOMAIN: ${STEUERBOT_DOMAIN:?STEUERBOT_DOMAIN in .env setzen}
      STEUERBOT_TLS: ${STEUERBOT_TLS:-internal}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped
    networks: [web]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

networks:
  web: {}

volumes:
  caddy_data: {}
  caddy_config: {}
